<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<title>DevSpace</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&family=Noto+Sans+Arabic:wght@400;500;700&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* =====================================================================
   1) STYLES — الألوان والمتغيرات الأساسية
   ===================================================================== */
:root{
  --bg:#FFFFFF; --text:#1F1F1F; --muted:#5F6368; --line:#E3E3E3; --line-strong:#DADCE0;
  --btn:#C2E7FF; --btn-text:#001D35; --btn-hover:#B0DDF9;
  --btn2:#D9FDD3; --btn2-text:#0A3D0A; --btn2-hover:#C7F3BF;
  --hover:#F1F3F4; --surface:#F8FAFD; --link:#0B57D0; --danger-bg:#F9DEDC; --danger-text:#410E0B;
  --nav-h:64px; --top-h:64px;
  --font:"Google Sans",Roboto,"Noto Sans Arabic","Segoe UI",system-ui,-apple-system,sans-serif;
  --mono:"Roboto Mono",ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:400 14px/1.5 var(--font);-webkit-font-smoothing:antialiased;overflow:hidden}
button,input,select,textarea{font:inherit;color:inherit}
a{color:var(--link);text-decoration:none}
a:hover{text-decoration:underline}
.ic{width:20px;height:20px;fill:currentColor;flex:none}
[dir=rtl] .flip{transform:scaleX(-1)}
.grow{flex:1}
.sub{color:var(--muted);font-size:12px}

/* التخطيط العام */
#app{display:flex;flex-direction:column;height:100vh;height:100dvh;background:#fff}
#topbar{flex:none;height:var(--top-h);display:flex;align-items:center;gap:12px;padding:0 16px;background:#fff;border-bottom:1px solid transparent;transition:border-color .2s}
#topbar.sc{border-bottom-color:var(--line)}
#app.editor-mode #topbar{display:none}
#view{flex:1;min-height:0;overflow-y:auto;overflow-x:hidden;position:relative}
#view.edit{overflow:hidden}
.brand{display:flex;align-items:center;gap:10px;font:500 20px var(--font);color:var(--text);cursor:pointer}
.brand:hover{text-decoration:none}
.brand-mark{width:34px;height:34px;border-radius:10px;background:var(--btn);color:var(--btn-text);display:grid;place-items:center;font:700 13px var(--mono);direction:ltr}
.topsearch,.bigsearch{display:flex;align-items:center;gap:10px;height:46px;padding:0 16px;border-radius:24px;background:#F1F3F4;transition:background .2s,box-shadow .2s;color:var(--muted)}
.topsearch{flex:1;min-width:0;max-width:680px;margin-inline:auto}
#app{width:100%;max-width:100vw;overflow:hidden}
#topbar{min-width:0;overflow:hidden}
.brand{flex:none}
.topsearch input{text-overflow:ellipsis}
@media(max-width:560px){.brand-name{display:none}#topbar{gap:8px;padding:0 10px}}
.topsearch:focus-within,.bigsearch:focus-within{background:#fff;box-shadow:0 1px 6px rgba(32,33,36,.28)}
.topsearch input,.bigsearch input{flex:1;border:0;outline:0;background:transparent;font-size:16px;min-width:0;color:var(--text)}

/* الشريط السفلي */
#bottomnav{flex:none;display:flex;justify-content:space-around;height:calc(var(--nav-h) + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);background:#FFFFFF;border-top:1px solid var(--line-strong)}
.nav-item{flex:1;max-width:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;color:var(--muted);font-size:12px;font-weight:500;padding-top:6px;text-decoration:none!important}
.nav-item .pill{width:64px;height:32px;border-radius:16px;display:grid;place-items:center;transition:background .2s;overflow:hidden;position:relative}
.nav-item:hover .pill{background:var(--hover)}
.nav-item.on{color:var(--text)}
.nav-item.on .pill{background:var(--btn);color:var(--btn-text)}

/* أزرار */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:40px;padding:0 20px;border:0;border-radius:20px;background:var(--btn);color:var(--btn-text);font:500 14px var(--font);cursor:pointer;position:relative;overflow:hidden;white-space:nowrap;transition:box-shadow .2s,background .2s}
.btn:hover{background:var(--btn-hover);box-shadow:0 1px 3px rgba(60,64,67,.3)}
.btn.green{background:var(--btn2);color:var(--btn2-text)}
.btn.green:hover{background:var(--btn2-hover)}
.btn.text{background:transparent;color:var(--link)}
.btn.text:hover{background:#F1F6FE;box-shadow:none}
.btn.danger{background:var(--danger-bg);color:var(--danger-text)}
.btn.sm{height:32px;padding:0 14px;font-size:13px}
.btn[disabled]{opacity:.5;pointer-events:none}
.btn .ic{width:18px;height:18px}
.icon-btn{width:40px;height:40px;border-radius:50%;border:0;background:transparent;display:inline-grid;place-items:center;cursor:pointer;color:var(--muted);position:relative;overflow:hidden;flex:none}
.icon-btn:hover{background:var(--hover)}
.icon-btn.xs{width:32px;height:32px}
.icon-btn.on{color:var(--link)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.18;transform:scale(0);animation:rip .5s ease-out forwards;pointer-events:none}
@keyframes rip{to{transform:scale(1);opacity:0}}

/* صفحات */
.page{max-width:1100px;margin:0 auto;padding:16px 16px 40px}
.page.narrow{max-width:760px}
.page h1{font:400 28px/1.3 var(--font);margin:8px 0 16px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card{border:1px solid var(--line);border-radius:16px;background:#fff}
.chip{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:8px;border:1px solid var(--line-strong);font-size:13px;color:var(--muted);background:#fff;cursor:default}
.chip.on{background:var(--btn);border-color:transparent;color:var(--btn-text)}
button.chip{cursor:pointer}
.chip .ic{width:16px;height:16px}
.empty{text-align:center;color:var(--muted);padding:48px 16px}
.empty .big{width:72px;height:72px;border-radius:50%;background:var(--surface);display:grid;place-items:center;margin:0 auto 16px;color:#80868B}
.empty .big .ic{width:36px;height:36px}
.empty h3{margin:0 0 6px;color:var(--text);font:500 18px var(--font)}

/* الرئيسية */
.hero{text-align:center;padding:40px 0 24px}
.wordmark{font:500 clamp(40px,9vw,64px)/1.1 var(--font);letter-spacing:-1px;margin-bottom:24px;direction:ltr}
.bigsearch{max-width:620px;margin:0 auto;height:52px;border:1px solid var(--line-strong);background:#fff}
.hero-actions{display:flex;gap:12px;justify-content:center;margin-top:24px;flex-wrap:wrap}
.sec-h{display:flex;align-items:center;justify-content:space-between;margin:28px 0 12px}
.sec-h h2{font:500 18px var(--font);margin:0}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}
.rc{padding:16px;cursor:pointer;position:relative;transition:box-shadow .2s,border-color .2s}
.rc:hover{box-shadow:0 1px 6px rgba(60,64,67,.25);border-color:transparent}
.rc-top{display:flex;align-items:center;gap:8px;padding-inline-end:36px}
.rc-top .ic{color:var(--muted)}
.rc-name{font:500 16px var(--font);color:var(--link);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rc-desc{color:var(--muted);margin:8px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:42px}
.rc-meta{display:flex;gap:12px;color:var(--muted);font-size:12px;flex-wrap:wrap}
.rc-save{position:absolute;top:10px;inset-inline-end:10px}
.alist .arow{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);cursor:pointer}
.alist .arow:last-child{border:0}
.alist .arow:hover{background:var(--surface)}
.alist .ic{color:var(--muted)}
.meter{height:8px;border-radius:4px;background:#E8EAED;overflow:hidden;margin:8px 0}
.meter i{display:block;height:100%;background:#4285F4}

/* المستودع */
.rhead{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.rhead h1{margin:0;font:400 26px var(--font);word-break:break-word}
.rdesc{color:var(--muted);margin:8px 0 12px}
.tabs{display:flex;border-bottom:1px solid var(--line);margin:16px 0}
.tab{padding:10px 20px;color:var(--muted);border-bottom:3px solid transparent;cursor:pointer;font-weight:500}
.tab:hover{background:var(--hover)}
.tab.on{color:var(--link);border-color:var(--link)}
.lbar{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;margin:10px 0 6px}
.lbar i{display:block;height:100%}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted)}
.legend b{display:inline-block;width:10px;height:10px;border-radius:50%;margin-inline-end:5px;vertical-align:middle}
.crumbs{display:flex;align-items:center;gap:4px;flex-wrap:wrap;font-size:15px;margin:0 0 12px}
.crumbs a,.crumbs span{padding:2px 4px;border-radius:6px}
.crumbs a:hover{background:var(--hover);text-decoration:none}
.files{overflow:hidden}
.frow{display:grid;grid-template-columns:28px minmax(0,1fr) 90px 130px 36px;align-items:center;gap:12px;padding:0 8px 0 16px;min-height:50px;border-bottom:1px solid var(--line);cursor:pointer}
.frow:last-child{border:0}
.frow:not(.fh):hover{background:var(--surface)}
.fh{background:var(--surface);min-height:40px;color:var(--muted);font-size:12px;font-weight:500;cursor:default}
.fn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fsize,.fdate{color:var(--muted);font-size:13px}
@media(max-width:640px){.frow{grid-template-columns:28px minmax(0,1fr) 36px}.fsize,.fdate{display:none}}
.md{padding:20px 24px;line-height:1.7}
.md h1,.md h2{border-bottom:1px solid var(--line);padding-bottom:.3em}
.md code{background:#F1F3F4;padding:2px 6px;border-radius:6px;font-family:var(--mono);font-size:.9em}
.md pre{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;overflow:auto;direction:ltr;text-align:left}
.md pre code{background:none;padding:0}
.md blockquote{margin:0;padding:0 1em;color:var(--muted);border-inline-start:4px solid var(--line-strong)}
.md table{border-collapse:collapse}.md td,.md th{border:1px solid var(--line-strong);padding:6px 12px}
.md img{max-width:100%}
.dropzone{position:fixed;inset:0;background:rgba(194,231,255,.85);z-index:90;display:grid;place-items:center;font:500 22px var(--font);color:var(--btn-text);border:4px dashed #4285F4;margin:8px;border-radius:24px}

/* نتائج البحث */
.sres{padding:14px 0;border-bottom:1px solid var(--line);cursor:pointer}
.sres .path{color:var(--muted);font-size:12px;direction:ltr;text-align:start}
.sres .ttl{color:var(--link);font:400 18px var(--font);margin:2px 0}
.sres:hover .ttl{text-decoration:underline}
.snip{font:12.5px/1.6 var(--mono);color:#3C4043;direction:ltr;text-align:left;white-space:pre;overflow:hidden;text-overflow:ellipsis}
mark{background:#FEF0A0;color:inherit;border-radius:2px}

/* نوافذ وقوائم */
.scrim{position:fixed;inset:0;background:rgba(32,33,36,.32);display:grid;place-items:center;z-index:100;animation:fade .15s}
@keyframes fade{from{opacity:0}}
.dialog{background:#fff;border-radius:28px;width:min(92vw,480px);max-height:88vh;overflow:auto;padding:24px;box-shadow:0 8px 28px rgba(0,0,0,.28)}
.dialog h2{font:400 22px var(--font);margin:0 0 14px}
.dmsg{color:var(--muted);margin:0 0 12px;word-break:break-word}
.field{margin-bottom:14px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input,.field textarea,.field select{width:100%;border:1px solid #747775;border-radius:8px;padding:10px 12px;background:#fff;outline:0}
.field input:focus,.field textarea:focus,.field select:focus{border-color:var(--link);box-shadow:0 0 0 1px var(--link)}
.derr{color:#B3261E;font-size:13px;margin:-4px 0 10px}
.dact{display:flex;justify-content:flex-end;gap:8px;margin-top:18px}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.menu{position:fixed;background:#fff;border-radius:12px;box-shadow:0 2px 6px 2px rgba(60,64,67,.15),0 1px 2px rgba(60,64,67,.3);padding:8px 0;min-width:200px;z-index:120;animation:fade .12s}
.mi{display:flex;align-items:center;gap:12px;width:100%;height:40px;padding:0 16px;border:0;background:none;cursor:pointer;text-align:start;color:var(--text)}
.mi:hover{background:var(--hover)}
.mi .ic{color:var(--muted)}
.mi.danger{color:#B3261E}.mi.danger .ic{color:#B3261E}
.sep{height:1px;background:var(--line);margin:6px 0}
.toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + 16px + env(safe-area-inset-bottom));transform:translate(-50%,20px);background:#2B2B2B;color:#fff;padding:12px 16px;border-radius:8px;z-index:130;display:flex;gap:16px;align-items:center;opacity:0;pointer-events:none;transition:.2s;max-width:90vw}
.toast.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.toast button{background:none;border:0;color:#A8C7FA;font-weight:500;cursor:pointer}

/* =====================================================================
   2) STYLES — مساحة العمل والمحرر
   ===================================================================== */
.ws{--fs:13.5px;--lh:21px;display:flex;height:100%;background:#fff;position:relative}
.side{width:268px;flex:none;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;min-height:0;background:#fff}
.side-h{display:flex;align-items:center;gap:4px;padding:8px;height:52px;border-bottom:1px solid var(--line)}
.side-title{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.side-tools{display:flex;padding:4px 8px;gap:2px;border-bottom:1px solid var(--line)}
.tree{flex:1;overflow:auto;padding:6px 0}
.trow{display:flex;align-items:center;gap:6px;height:34px;padding-inline:calc(8px + var(--d,0)*14px) 4px;cursor:pointer;font-size:13px;white-space:nowrap}
.trow:hover{background:var(--hover)}
.trow.on{background:var(--btn);color:var(--btn-text)}
.trow .tn{flex:1;overflow:hidden;text-overflow:ellipsis}
.trow .icon-btn{opacity:0;width:28px;height:28px}
.trow:hover .icon-btn,.trow.on .icon-btn{opacity:1}
@media(hover:none){.trow .icon-btn{opacity:1}}
.mcol{flex:1;min-width:0;display:flex;flex-direction:column}
.ed-top{height:52px;display:flex;align-items:center;gap:6px;padding:0 8px;border-bottom:1px solid var(--line);flex:none}
.fname{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;min-width:0}
.fname small{color:var(--muted);font-weight:400}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#F29900;margin-inline-start:6px}
.only-narrow{display:none}
.tabsbar{display:flex;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--surface);flex:none;min-height:38px}
.etab{display:flex;align-items:center;gap:6px;height:38px;padding:0 6px 0 12px;border-inline-end:1px solid var(--line);cursor:pointer;font-size:13px;white-space:nowrap;color:var(--muted);direction:ltr}
.etab.on{background:#fff;color:var(--text);box-shadow:inset 0 -2px 0 var(--link)}
.etab .icon-btn{width:22px;height:22px}
.etab .icon-btn .ic{width:14px;height:14px}
.panes{flex:1;min-height:0;display:flex}
.pane-wrap{flex:1;min-width:0;position:relative;background:#fff}
.pane{position:absolute;inset:0}
.scroller{position:absolute;inset:0;overflow:auto;direction:ltr;background:#fff}
.inner{display:flex;min-width:100%;min-height:100%}
.gut{position:sticky;left:0;z-index:2;background:#fff;border-right:1px solid var(--line);padding:12px 10px 12px 14px;text-align:right;color:#9AA0A6;font:var(--fs)/var(--lh) var(--mono);user-select:none;white-space:pre;min-width:46px;flex:none}
.code{flex:1;display:grid;padding:12px 16px 12px 12px;position:relative;min-width:0}
.code pre,.code textarea{grid-area:1/1;margin:0;padding:0;border:0;font:var(--fs)/var(--lh) var(--mono);tab-size:2;-moz-tab-size:2;white-space:pre;word-wrap:normal;letter-spacing:0;font-variant-ligatures:none;direction:ltr;text-align:left}
.code pre{pointer-events:none;color:var(--text)}
.code .marks{color:transparent}
.code .marks mark{background:#FFE9A0;border-radius:2px}
.code .marks mark.cur{background:#FFB74D}
.code textarea{resize:none;overflow:hidden;outline:0;background:transparent;color:transparent;-webkit-text-fill-color:transparent;caret-color:#1F1F1F;width:100%;height:100%}
.code textarea::selection{background:rgba(66,133,244,.28);-webkit-text-fill-color:transparent}
.code.plain .hl{color:transparent}
.code.plain textarea{color:var(--text);-webkit-text-fill-color:var(--text)}
.k{color:#9334E6}.s{color:#188038}.n{color:#B06000}.c{color:#80868B;font-style:italic}.f{color:#1967D2}.t{color:#C5221F}.a{color:#B06000}.p{color:#1967D2}
.cwm{position:absolute;visibility:hidden;white-space:pre;font:var(--fs) var(--mono);pointer-events:none}
.static{position:absolute;inset:0;display:grid;place-items:center;padding:24px;text-align:center;overflow:auto}
.static img{max-width:100%;max-height:70vh;border:1px solid var(--line);border-radius:8px;background:repeating-conic-gradient(#f1f3f4 0 25%,#fff 0 50%) 50%/16px 16px}
.empty-ed{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--muted);padding:24px}
.status{flex:none;height:28px;display:flex;align-items:center;gap:14px;padding:0 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);background:var(--surface);overflow:hidden;white-space:nowrap}
.findbar{position:absolute;top:8px;inset-inline-end:18px;z-index:6;background:#fff;border-radius:14px;padding:8px;box-shadow:0 2px 8px rgba(60,64,67,.35);display:flex;flex-direction:column;gap:6px;width:min(94%,380px)}
.findbar .r{display:flex;gap:4px;align-items:center}
.findbar input{flex:1;min-width:0;border:1px solid var(--line-strong);border-radius:8px;padding:6px 10px;outline:0}
.findbar input:focus{border-color:var(--link)}
.fcount{font-size:12px;color:var(--muted);min-width:42px;text-align:center}
.pv{flex:1;min-width:0;display:none;flex-direction:column;border-inline-start:1px solid var(--line);background:#fff}
.ws.pv-on .pv{display:flex}
.pv-bar{height:40px;display:flex;align-items:center;gap:2px;padding:0 6px 0 10px;border-bottom:1px solid var(--line);background:var(--surface);flex:none}
.pv-bar .t1{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;direction:ltr;text-align:start}
.pv iframe{flex:1;border:0;width:100%;background:#fff}
.cons{height:150px;overflow:auto;border-top:1px solid var(--line);background:#fff;font:12px/1.6 var(--mono);direction:ltr;text-align:left;flex:none}
.cons div{padding:2px 10px;border-bottom:1px solid #f1f3f4;white-space:pre-wrap;word-break:break-word}
.cons .error{color:#B3261E;background:#FCE8E6}.cons .warn{color:#B06000;background:#FEF7E0}
.ws.pv-full .pv{position:fixed;inset:0;z-index:95}
.side-scrim{display:none}
@media(max-width:860px){
  .only-narrow{display:inline-grid}
  .side{position:absolute;z-index:40;inset-block:0;inset-inline-start:0;transform:translateX(-105%);transition:transform .2s;box-shadow:2px 0 12px rgba(0,0,0,.2)}
  [dir=rtl] .side{transform:translateX(105%)}
  .ws.side-open .side{transform:none}
  .ws.side-open .side-scrim{display:block;position:absolute;inset:0;background:rgba(32,33,36,.32);z-index:30}
  .ws.pv-on .pane-wrap{display:none}
  .ed-top .btn span{display:none}
  .ed-top .btn{padding:0 10px}
}
</style>
</head>
<body>
<!-- =====================================================================
     3) HTML — الهيكل: الشريط العلوي، منطقة العرض، الشريط السفلي
     ===================================================================== -->
<div id="app">
  <header id="topbar">
    <a class="brand" href="#/home"><span class="brand-mark">&lt;/&gt;</span><span class="brand-name"></span></a>
    <form class="topsearch" data-submit="doSearch" role="search">
      <span id="tsIc"></span>
      <input id="tsq" type="search" autocomplete="off" enterkeyhint="search">
    </form>
    <button class="icon-btn" id="langBtn" data-act="lang" aria-label="Language"></button>
  </header>
  <main id="view"></main>
  <nav id="bottomnav"></nav>
</div>

<script>
/* =====================================================================
   4) SCRIPT — كل المنطق (إعدادات، قاعدة بيانات، واجهات، محرر، معاينة)
   ===================================================================== */
(()=>{
'use strict';

/* ---------- 4.1 الإعدادات المركزية (غيّر اسم المنصة من هنا) ---------- */
const CONFIG={
  APP_NAME:'DevSpace',
  DB_NAME:'devspace-db',
  DB_VERSION:1,

const RX_JSON=new RegExp('('+R_DQ+')(?=\\s*:)|('+R_DQ+')|('+R_NUM+')|(\\b(?:true|false|null)\\b)','g');
const RX_CSS=new RegExp('('+/\/\*[\s\S]*?\*\//.source+')|('+R_STR_C+')|(@[\\w-]+)|(#[\\da-fA-F]{3,8}\\b|\\b\\d*\\.?\\d+(?:px|em|rem|%|vh|vw|vmin|vmax|s|ms|deg|fr|ch|pt)?(?![\\w-]))|(\\b[a-z-]+(?=\\s*:(?!:)[^;{}]*[;}]))','gi');
const RX_MD=/(```[\s\S]*?```)|(^#{1,6}\s.*$)|(\*\*[^*\n]+\*\*)|(`[^`\n]+`)|(\[[^\]\n]*\]\([^)\n]*\))|(^\s*(?:[-*+]|\d+\.)\s)/gm;
const RX_HTML=new RegExp('(<script\\b[^>]*>)([\\s\\S]*?)(<\\/script>)|(<style\\b[^>]*>)([\\s\\S]*?)(<\\/style>)|(<!'+'--[\\s\\S]*?--'+'>)|(<!DOCTYPE[^>]*>)|(<\\/?[A-Za-z][\\w:-]*)((?:"[^"]*"|\'[^\']*\'|[^>"\'])*>)','gi');
const RX_ATTR=/("[^"]*"|'[^']*')|([\w:@.-]+)|([\/>]+)/g;
function tokenize(code,re,cls){
  let out='',last=0,m;re.lastIndex=0;
  while((m=re.exec(code))){
    if(m[0]===''){re.lastIndex++;continue}
    let i=1;while(i<m.length&&m[i]===undefined)i++;
    out+=esc(code.slice(last,m.index))+'<span class="'+cls[i-1]+'">'+esc(m[0])+'</span>';
    last=m.index+m[0].length;
  }
  return out+esc(code.slice(last));
}
const hlAttrs=s=>tokenize(s,new RegExp(RX_ATTR.source,'g'),['s','a','t']);
function hlTag(s){const mm=/^(<\/?[\w:-]+)([\s\S]*)$/.exec(s);return mm?'<span class="t">'+esc(mm[1])+'</span>'+hlAttrs(mm[2]):esc(s)}
function hlHtml(code){
  const re=new RegExp(RX_HTML.source,'gi');let out='',last=0,m;
  while((m=re.exec(code))){
    out+=esc(code.slice(last,m.index));
    if(m[1]!==undefined)out+=hlTag(m[1])+tokenize(m[2],RX.js,CLS5)+hlTag(m[3]);
    else if(m[4]!==undefined)out+=hlTag(m[4])+tokenize(m[5],RX_CSS,['c','s','k','n','p'])+hlTag(m[6]);
    else if(m[7]!==undefined||m[8]!==undefined)out+='<span class="c">'+esc(m[0])+'</span>';
    else out+='<span class="t">'+esc(m[9])+'</span>'+hlAttrs(m[10]);
    last=m.index+m[0].length;
  }
  return out+esc(code.slice(last));
}
const LANG_BY_EXT={js:'js',mjs:'js',cjs:'js',jsx:'js',ts:'js',tsx:'js',json:'json',css:'css',scss:'css',less:'css',html:'html',htm:'html',xml:'html',svg:'html',vue:'html',md:'md',markdown:'md',py:'py',sh:'sh',bash:'sh',yml:'sh',yaml:'sh',toml:'sh',ini:'sh',env:'sh',sql:'sql',java:'clike',c:'clike',h:'clike',cpp:'clike',hpp:'clike',cs:'clike',go:'clike',rs:'clike',php:'clike',kt:'clike',swift:'clike'};
const langOf=p=>LANG_BY_EXT[extOf(p)]||'plain';
const LANG_NAME={js:'JavaScript',json:'JSON',css:'CSS',html:'HTML',md:'Markdown',py:'Python',sh:'Shell',sql:'SQL',clike:'Code',plain:'Plain text'};
function highlight(code,lang){
  switch(lang){
    case'js':case'clike':case'py':case'sh':case'sql':return tokenize(code,RX[lang],CLS5);
    case'json':return tokenize(code,RX_JSON,['p','s','n','k']);
    case'css':return tokenize(code,RX_CSS,['c','s','k','n','p']);
    case'html':return hlHtml(code);
    case'md':return tokenize(code,RX_MD,['s','k','n','s','f','k']);

}

/* ---------- 4.5 تحويل Markdown إلى HTML ---------- */
const okUrl=u=>/^(https?:\/\/|mailto:|#|\.{0,2}\/|[\w@%.~-]+(\/|\.|$))/i.test(u);
function mdToHtml(src){
  src=src.replace(/\r\n?/g,'\n');const blocks=[];
  src=src.replace(/```[^\n]*\n([\s\S]*?)```/g,(m,c)=>{blocks.push('<pre><code>'+esc(c.replace(/\n$/,''))+'</code></pre>');return '\u0000'+(blocks.length-1)+'\u0000'});
  const inl=s=>{
    s=esc(s);
    s=s.replace(/`([^`\n]+)`/g,'<code>$1</code>');
    s=s.replace(/!\[([^\]]*)\]\(([^)\s]+)\)/g,(m,a,u)=>okUrl(u)?'<img alt="'+a+'" src="'+u+'">':'');
    s=s.replace(/\[([^\]]+)\]\(([^)\s]+)\)/g,(m,a,u)=>okUrl(u)?'<a href="'+u+'" target="_blank" rel="noopener">'+a+'</a>':a);
    s=s.replace(/\*\*([^*\n]+)\*\*/g,'<b>$1</b>').replace(/(^|[\s(])\*([^*\n]+)\*(?=$|[\s).,!?])/g,'$1<i>$2</i>').replace(/~~([^~\n]+)~~/g,'<s>$1</s>');
    return s;
  };
  const L=src.split('\n');let out='',i=0;const PH=/^\u0000\d+\u0000$/,LI=/^\s*([-*+]|\d+\.)\s+/;
  while(i<L.length){
    const l=L[i];let m;
    if(!l.trim()){i++;continue}
    if(PH.test(l.trim())){out+=l.trim();i++;continue}
    if((m=/^(#{1,6})\s+(.*?)\s*#*$/.exec(l))){out+='<h'+m[1].length+'>'+inl(m[2])+'</h'+m[1].length+'>';i++;continue}
    if(/^\s*([-*_])(\s*\1){2,}\s*$/.test(l)){out+='<hr>';i++;continue}
    if(/^\s*>/.test(l)){const q=[];while(i<L.length&&/^\s*>/.test(L[i])){q.push(L[i].replace(/^\s*>\s?/,''));i++}out+='<blockquote>'+mdToHtml(q.join('\n'))+'</blockquote>';continue}
    if(LI.test(l)){const ord=/^\s*\d+\./.test(l),it=[];while(i<L.length&&LI.test(L[i])){it.push(L[i].replace(LI,''));i++}out+=(ord?'<ol>':'<ul>')+it.map(x=>'<li>'+inl(x)+'</li>').join('')+(ord?'</ol>':'</ul>');continue}
    if(l.includes('|')&&i+1<L.length&&/^\s*\|?\s*:?-{2,}:?\s*(\|\s*:?-{2,}:?\s*)*\|?\s*$/.test(L[i+1])){
      const cells=r=>r.trim().replace(/^\||\|$/g,'').split('|').map(c=>c.trim());
      const hd=cells(l);i+=2;const rows=[];
      while(i<L.length&&L[i].includes('|')&&L[i].trim()){rows.push(cells(L[i]));i++}
      out+='<table><thead><tr>'+hd.map(c=>'<th>'+inl(c)+'</th>').join('')+'</tr></thead><tbody>'+rows.map(r=>'<tr>'+r.map(c=>'<td>'+inl(c)+'</td>').join('')+'</tr>').join('')+'</tbody></table>';continue;
    }
    const p=[];
    while(i<L.length&&L[i].trim()&&!/^(#{1,6}\s|\s*>)/.test(L[i])&&!LI.test(L[i])&&!PH.test(L[i].trim())){p.push(L[i].trim());i++}
    if(!p.length){p.push(L[i].trim());i++}
    out+='<p>'+inl(p.join(' '))+'</p>';
  }
  return out.replace(/\u0000(\d+)\u0000/g,(m,n)=>blocks[+n]!==undefined?blocks[+n]:m);
}

function modal({title,body='',actions,cls='',onOpen}){
  return new Promise(res=>{
    const sc=document.createElement('div');sc.className='scrim';
    sc.innerHTML=`<div class="dialog ${cls}" role="dialog" aria-modal="true"><h2>${esc(title)}</h2><div class="dbody">${body}</div><div class="derr" hidden></div><div class="dact"></div></div>`;
    document.body.appendChild(sc);
    const dlg=$('.dialog',sc),bar=$('.dact',sc);
    const done=v=>{document.removeEventListener('keydown',onKey,true);sc.remove();res(v)};
    actions.forEach(a=>{
      const b=document.createElement('button');b.className='btn '+(a.cls||'text');b.textContent=a.label;
      b.onclick=()=>{if(a.collect){const r=a.collect(dlg);if(r===false)return;done(r)}else done(a.value)};
      bar.appendChild(b);a.el=b;
    });
    function onKey(e){
      if(e.key==='Escape'){e.stopPropagation();done(null)}
      else if(e.key==='Enter'&&e.target.tagName!=='TEXTAREA'&&!e.target.closest('.dact')){const p=actions.find(a=>a.primary);if(p){e.preventDefault();p.el.click()}}
    }
    document.addEventListener('keydown',onKey,true);
    sc.addEventListener('mousedown',e=>{if(e.target===sc)done(null)});
    const f=$('input,textarea,select',dlg);
    if(f){f.focus();if(f.tagName==='INPUT')f.select()}else{const p=actions.find(a=>a.primary);if(p)p.el.focus()}
    if(onOpen)onOpen(dlg,done);
  });
}
function ask({title,message='',fields=[],ok,validate,cls=''}){
  const body=(message?`<p class="dmsg">${message}</p>`:'')+fields.map(f=>{
    const id='f_'+f.id;let inp;
    if(f.type==='textarea')inp=`<textarea id="${id}" rows="3">${esc(f.value||'')}</textarea>`;
    else if(f.type==='select')inp=`<select id="${id}">${f.options.map(o=>`<option value="${esc(o[0])}" ${o[0]===f.value?'selected':''}>${esc(o[1])}</option>`).join('')}</select>`;
    else inp=`<input id="${id}" type="text" value="${esc(f.value||'')}" placeholder="${esc(f.placeholder||'')}" autocomplete="off" dir="auto">`;
    return `<div class="field"><label for="${id}">${esc(f.label)}</label>${inp}</div>`;
  }).join('');
  return modal({title,body,actions:[
    {label:t('إلغاء','Cancel'),cls:'text',value:null},
    {label:ok||t('موافق','OK'),cls,primary:true,collect:dlg=>{
      const v={};fields.forEach(f=>v[f.id]=$('#f_'+f.id,dlg).value);
      const err=validate?validate(v):'';
      if(err){const e=$('.derr',dlg);e.textContent=err;e.hidden=false;return false}
      return v;
    }}
  ]});
}

let _menu=null,_menuOut=null;

  document.body.appendChild(m);_menu=m;
  const r=anchor.getBoundingClientRect(),mw=m.offsetWidth,mh=m.offsetHeight;
  let x=(r.left+r.width/2<innerWidth/2)?r.left:r.right-mw;
  let y=r.bottom+4;if(y+mh>innerHeight-8)y=Math.max(8,r.top-mh-4);

function toast(msg,o={}){

/* ---------- 4.7 رفع الملفات والمجلدات و ZIP ---------- */
function pickFiles({multiple=false,directory=false,accept=''}={}){
  return new Promise(ok=>{
    const i=document.createElement('input');i.type='file';i.style.display='none';
    if(multiple)i.multiple=true;if(directory){i.webkitdirectory=true}if(accept)i.accept=accept;
    i.onchange=()=>{ok(i.files);i.remove()};document.body.appendChild(i);i.click();
  });
}
async function zipItems(file){
  const JSZip=await loadJSZip();const z=await JSZip.loadAsync(file);const items=[];
  z.forEach((p,en)=>{if(!en.dir)items.push({path:p,get:()=>en.async('arraybuffer')})});
  return items;
}
function stripRoot(items){
  if(!items.length)return items;
  const first=items[0].path.split('/')[0];
  if(items.every(i=>i.path.includes('/')&&i.path.split('/')[0]===first))return items.map(i=>({...i,path:i.path.slice(first.length+1)}));
  return items;
}
function collectDrop(dt){
  const ents=[...dt.items||[]].filter(i=>i.kind==='file').map(i=>i.webkitGetAsEntry?i.webkitGetAsEntry():null);
  const files=[...dt.files||[]];
  return (async()=>{
    const out=[];
    async function walk(en,pre){
      if(en.isFile){const f=await new Promise((ok,no)=>en.file(ok,no));out.push({path:pre+en.name,get:()=>f.arrayBuffer()})}
      else if(en.isDirectory){
        const rd=en.createReader();let all=[];
        for(;;){const b=await new Promise((ok,no)=>rd.readEntries(ok,no));if(!b.length)break;all=all.concat([...b])}
        for(const c of all)await walk(c,pre+en.name+'/');
      }
    }
    if(ents.length&&ents.every(Boolean)){for(const en of ents)await walk(en,'')}
    else files.forEach(f=>out.push({path:f.name,get:()=>f.arrayBuffer()}));
    return out;
  })();
}
async function ingest(id,items,label){
  const prog=toast(t('جارٍ الرفع…','Uploading…'),{sticky:true});
  const exist=new Set((await listFiles(id)).map(m=>m.path));
  let done=0,skipped=0,replaced=0,batch=[],bytes=0;
  const flush=async()=>{if(batch.length){await writeFiles(id,batch);batch=[];bytes=0}};
  try{
    for(const it of items){
      const p=normPath(it.path);
      if(!p||badPath(p)||IGNORE.test(p)){skipped++;continue}
      const buf=await it.get();
      const e=looksText(p,buf)?{path:p,text:new TextDecoder('utf-8').decode(buf)}:{path:p,buffer:buf};
      if(exist.has(p))replaced++;exist.add(p);
      batch.push(e);bytes+=buf.byteLength;done++;
      if(batch.length>=40||bytes>20e6){await flush();prog.update(t('جارٍ الرفع… ','Uploading… ')+done+'/'+items.length)}
    }
    await flush();
  }catch(err){console.error(err);prog.close();toast(t('فشل الرفع: ','Upload failed: ')+err.message);return 0}
  prog.close();
  await logAct(id,'upload',label||(done+''));
  toast(t(`تم رفع ${done} ملف`,`Uploaded ${done} file(s)`)+(replaced?t(` (استُبدل ${replaced})`,` (${replaced} replaced)`):'')+(skipped?t(` — تجاهل ${skipped}`,` — ${skipped} skipped`):''));
  return done;
}
async function uploadInto(id,dir,items){
  const pre=dir?dir+'/':'';

}
async function uniqueName(base){
  const names=new Set((await allRepos()).map(r=>r.name.toLowerCase()));
  base=(base||t('مشروع جديد','New project')).trim();let n=base,i=2;
  while(names.has(n.toLowerCase()))n=base+' ('+i++ +')';
  return n;

async function importFlow(kind){
  let items=[],name='';
  try{
    if(kind==='zip'){
      const fl=await pickFiles({accept:'.zip,application/zip'});const f=fl[0];if(!f)return;
      items=stripRoot(await zipItems(f));name=f.name.replace(/\.zip$/i,'');
    }else if(kind==='folder'){
      const fl=await pickFiles({directory:true});if(!fl.length)return;
      items=[...fl].map(f=>({path:f.webkitRelativePath||f.name,get:()=>f.arrayBuffer()}));
      name=items[0].path.split('/')[0];items=stripRoot(items);
    }else{
      const fl=await pickFiles({multiple:true});if(!fl.length)return;
      items=[...fl].map(f=>({path:f.name,get:()=>f.arrayBuffer()}));
    }
  }catch(e){toast(t('تعذّر قراءة الملف (قراءة ZIP تحتاج اتصالاً بالإنترنت لمرة واحدة)','Could not read file (ZIP needs an internet connection once)'));return}
  const repo=await createRepo({name:await uniqueName(name),desc:'',vis:'public'});
  await ingest(repo.id,items,t('استيراد مشروع','Project import'));
  location.hash='#/r/'+repo.id;
}
async function zipRepo(id,sub){
  const JSZip=await loadJSZip();const z=new JSZip();const pre=sub?sub+'/':'';
  for(const m of await listFiles(id)){
    if(pre&&!m.path.startsWith(pre))continue;
    const f=await readFile(id,m.path);z.file(m.path.slice(pre.length),f.text!==undefined?f.text:f.buffer);
  }
  return z.generateAsync({type:'blob'});
}
async function downloadPath(id,path,isDir){
  try{
    if(isDir){const repo=await getRepo(id);downloadBlob(await zipRepo(id,path),(path?baseName(path):repo.name)+'.zip')}
    else{const f=await readFile(id,path);if(!f)return;downloadBlob(new Blob([f.text!==undefined?f.text:f.buffer],{type:mimeOf(path)}),baseName(path))}
  }catch(e){toast(t('تعذّر إنشاء الملف (تحقق من الاتصال)','Could not create file (check connection)'))}
}

async function fsRename(id,path,isDir){

      if(isDir&&(p+'/').startsWith(path+'/'))return t('لا يمكن نقل مجلد إلى داخله','Cannot move a folder into itself');
      if(ex.has(p)||[...ex].some(x=>x.startsWith(p+'/')))return t('المسار موجود مسبقاً','Path already exists');return ''}});

let searchTok=0;
async function runSearch(q,f){
  const box=$('#sres');if(!box)return;const my=++searchTok;
  if(!q){box.innerHTML=`<div class="empty"><div class="big">${ic('search')}</div><div>${t('اكتب كلمة للبحث في أسماء المستودعات والملفات ومحتوى الأكواد.','Type a word to search repository names, file names and code contents.')}</div></div>`;return}
  box.innerHTML=`<div class="empty">${t('جارٍ البحث…','Searching…')}</div>`;
  const ql=q.toLowerCase(),re=new RegExp(escRe(esc(q)),'gi');
  const hi=s=>esc(s).replace(re,m=>'<mark>'+m+'</mark>');
  const repos=await allRepos();const rn=new Map(repos.map(r=>[r.id,r.name]));
  let html='';
  if(f==='all'||f==='repos'){
    const hit=repos.filter(r=>r.name.toLowerCase().includes(ql)||(r.desc||'').toLowerCase().includes(ql));
    if(hit.length)html+=`<h3 class="sub" style="margin:16px 0 0">${t('المستودعات','Repositories')}</h3>`+hit.map(r=>`<div class="sres" data-act="go" data-to="#/r/${r.id}"><div class="path">${ic('book')}</div><div class="ttl" dir="auto">${hi(r.name)}</div><div class="sub">${hi(r.desc||'')}</div></div>`).join('');
  }
  if(f==='all'||f==='files'){
    const ms=(await R(store('files').getAll())).filter(m=>m.path.toLowerCase().includes(ql)&&baseName(m.path)!=='.gitkeep').slice(0,60);
    if(ms.length)html+=`<h3 class="sub" style="margin:16px 0 0">${t('الملفات','Files')}</h3>`+ms.map(m=>`<div class="sres" data-act="go" data-to="${repoHash(m.repoId,'blob',m.path)}"><div class="path">${esc(rn.get(m.repoId)||'')}</div><div class="ttl" dir="ltr" style="text-align:start">${hi(m.path)}</div></div>`).join('');
  }
  if(f==='all'||f==='code'){
    const out=[];
    await new Promise(ok=>{
      const r=store('data').openCursor();
      r.onsuccess=()=>{
        const c=r.result;if(!c||out.length>=40||my!==searchTok){ok();return}
        const v=c.value;
        if(v.t&&v.c.toLowerCase().includes(ql)){
          const lines=v.c.split('\n'),hits=[];
          for(let i=0;i<lines.length&&hits.length<3;i++)if(lines[i].toLowerCase().includes(ql))hits.push([i+1,lines[i].trim().slice(0,160)]);
          const k=v.key,ix=k.indexOf('/');out.push({repoId:k.slice(0,ix),path:k.slice(ix+1),hits});
        }
        c.continue();
      };r.onerror=()=>ok();
    });
    if(my!==searchTok)return;
    if(out.length)html+=`<h3 class="sub" style="margin:16px 0 0">${t('الأكواد','Code')}</h3>`+out.map(o=>`<div class="sres" data-act="go" data-to="${repoHash(o.repoId,'blob',o.path)}?l=${o.hits[0][0]}"><div class="path">${esc(rn.get(o.repoId)||'')}</div><div class="ttl" dir="ltr" style="text-align:start">${esc(o.path)}</div>${o.hits.map(h=>`<div class="snip">${h[0]}: ${hi(h[1])}</div>`).join('')}</div>`).join('');
  }
  if(my!==searchTok)return;
  box.innerHTML=html||`<div class="empty"><div class="big">${ic('search')}</div><h3>${t('لا توجد نتائج','No results')}</h3><div>${t('جرّب كلمات مختلفة.','Try different words.')}</div></div>`;
}

  if(!repo)return {html:`<div class="empty"><div class="big">${ic('book')}</div><h3>${t('المستودع غير موجود','Repository not found')}</h3><a href="#/repos">${t('العودة إلى المستودعات','Back to repositories')}</a></div>`};
  const metas=(await listFiles(id));
  RepoCtx.id=id;RepoCtx.dir=dir;RepoCtx.active=true;RepoCtx.repo=repo;
  const vis=metas.filter(m=>baseName(m.path)!=='.gitkeep');
  const pre=dir?dir+'/':'';
  const ent=new Map();
  for(const m of metas){
    if(!m.path.startsWith(pre))continue;
    const rest=m.path.slice(pre.length),i=rest.indexOf('/');
    if(i<0){if(rest!=='.gitkeep')ent.set(rest,{name:rest,dir:false,size:m.size,updated:m.updated,path:m.path})}
    else{const n=rest.slice(0,i);const e=ent.get(n)||{name:n,dir:true,size:0,updated:0,path:pre+n};
      if(baseName(m.path)!=='.gitkeep')e.size+=m.size;e.updated=Math.max(e.updated,m.updated);ent.set(n,e)}
  }
  const rows=[...ent.values()].sort((a,b)=>a.dir!==b.dir?(a.dir?-1:1):cmp(a.name,b.name));
  const lang={};let tot=0;
  vis.forEach(m=>{if(m.isText){const l=statLang(extOf(m.path));lang[l]=(lang[l]||0)+m.size;tot+=m.size}});
  const lk=Object.keys(lang).sort((a,b)=>lang[b]-lang[a]);
  const crumbs=`<div class="crumbs"><a href="${repoHash(id)}">${esc(repo.name)}</a>${dir.split('/').filter(Boolean).map((s,i,a)=>`<span class="sub">/</span><a href="${repoHash(id,'tree',a.slice(0,i+1).join('/'))}">${esc(s)}</a>`).join('')}</div>`;
  let body='';
  if(tab==='activity'){
    const acts=await listAct(id);
    body=acts.length?`<div class="card alist">${acts.map(a=>actRow(a,'')).join('')}</div>`:`<div class="empty">${t('لا يوجد نشاط','No activity')}</div>`;
  }else{
    const parent=dir?`<div class="frow" data-act="go" data-to="${dirName(dir)?repoHash(id,'tree',dirName(dir)):repoHash(id)}"><span>${ic('back','flip')}</span><span class="fn">..</span><span></span><span></span><span></span></div>`:'';
    body=crumbs+(rows.length||dir?`<div class="card files"><div class="frow fh"><span></span><span>${t('الاسم','Name')}</span><span class="fsize">${t('الحجم','Size')}</span><span class="fdate">${t('آخر تعديل','Modified')}</span><span></span></div>${parent}${rows.map(r=>`<div class="frow" data-act="go" data-to="${repoHash(id,r.dir?'tree':'blob',r.path)}"><span>${fileIcon(r.name,r.dir)}</span><span class="fn" dir="auto">${esc(r.name)}</span><span class="fsize">${r.dir?'':fmtBytes(r.size)}</span><span class="fdate">${rel(r.updated)}</span><button class="icon-btn xs" data-act="rowMenu" data-p="${esc(r.path)}" data-d="${r.dir?1:0}" aria-label="menu">${ic('more')}</button></div>`).join('')}${!rows.length?`<div class="empty" style="padding:28px">${t('هذا المجلد فارغ','This folder is empty')}</div>`:''}</div>`:
      `<div class="card empty"><div class="big">${ic('code')}</div><h3>${t('المستودع فارغ','This repository is empty')}</h3><div style="margin-bottom:16px">${t('أنشئ ملفاً أو ارفع ملفاتك، أو اسحبها وأفلتها هنا.','Create a file, upload files, or drag and drop them here.')}</div><div class="row" style="justify-content:center"><button class="btn" data-act="newFile">${ic('newFile')}${t('ملف جديد','New file')}</button><button class="btn green" data-act="uploadMenu">${ic('upload')}${t('رفع','Upload')}</button></div></div>`);
    const rd=[...ent.values()].find(e=>!e.dir&&/^readme(\.md|\.markdown)?$/i.test(e.name)&&/\.(md|markdown)$/i.test(e.name));
    if(rd){const f=await readFile(id,rd.path);if(f&&f.text!==undefined)body+=`<div class="card" style="margin-top:16px"><div class="sub" style="padding:10px 16px;border-bottom:1px solid var(--line)">${ic('file')} ${esc(rd.name)}</div><div class="md" id="readme">${mdToHtml(f.text)}</div></div>`}
  }
  const html=`<div class="page">
    <div class="rhead">${ic('book')}<h1 dir="auto">${esc(repo.name)}</h1><span class="chip">${ic(repo.vis==='private'?'lock':'pub')}${repo.vis==='private'?t('خاص','Private'):t('عام','Public')}</span><span class="grow"></span>
      <button class="icon-btn ${repo.saved?'on':''}" data-act="saveToggle" data-id="${id}" title="${t('حفظ المشروع','Save project')}">${ic(repo.saved?'bookmark':'bookmarkO')}</button>
      <button class="icon-btn" data-act="repoMenu" data-id="${id}">${ic('more')}</button></div>
    ${repo.desc?`<div class="rdesc" dir="auto">${esc(repo.desc)}</div>`:''}
    <div class="row" style="margin:8px 0"><span class="chip">${vis.length} ${t('ملف','files')}</span><span class="chip">${fmtBytes(repo.size)}</span><span class="chip">${t('آخر تحديث','Updated')} ${rel(repo.updated)}</span></div>
    ${tot?`<div class="lbar">${lk.map(k=>`<i style="width:${lang[k]/tot*100}%;background:${LANG_COL[k]}"></i>`).join('')}</div><div class="legend">${lk.slice(0,6).map(k=>`<span><b style="background:${LANG_COL[k]}"></b>${k} ${(lang[k]/tot*100).toFixed(1)}%</span>`).join('')}</div>`:''}
    <div class="row" style="margin:18px 0 4px"><button class="btn" data-act="openEditor">${ic('code')}${t('فتح المحرر','Open editor')}</button><button class="btn" data-act="newFile">${ic('newFile')}${t('ملف جديد','New file')}</button><button class="btn green" data-act="newFolder">${ic('newFolder')}${t('مجلد جديد','New folder')}</button><button class="btn green" data-act="uploadMenu">${ic('upload')}${t('رفع','Upload')}</button></div>
    <div class="tabs"><div class="tab ${tab!=='activity'?'on':''}" data-act="go" data-to="${repoHash(id,dir?'tree':'',dir)}">${t('الكود','Code')}</div><div class="tab ${tab==='activity'?'on':''}" data-act="go" data-to="${repoHash(id,'activity')}">${t('النشاط','Activity')}</div></div>
    ${body}
  </div>`;
  return {html,after:()=>{const b=$('#readme');if(b)fixImgs(b,id,dir)}};
}

/* ---------- 4.10 المحرر: الأدوات ---------- */
function replaceRange(ta,a,b,text,s1,s2){
  ta.focus();ta.setSelectionRange(a,b);let ok=false;
  try{ok=text===''?document.execCommand('delete'):document.execCommand('insertText',false,text)}catch(e){}
  if(!ok){ta.setRangeText(text,a,b,'end');ta.dispatchEvent(new Event('input',{bubbles:true}))}
  if(s1!=null)ta.setSelectionRange(s1,s2==null?s1:s2);
}
const lineStart=(v,p)=>p?v.lastIndexOf('\n',p-1)+1:0;
function blockRange(ta){
  const v=ta.value,a=ta.selectionStart,b=ta.selectionEnd;
  const s=lineStart(v,a);let end=b;if(b>a&&v[b-1]==='\n')end=b-1;
  let e=v.indexOf('\n',end);if(e<0)e=v.length;
  return {v,a,b,s,e};
}
function doIndent(ta,out){
  const {v,a,b,s,e}=blockRange(ta);
  if(a===b&&!out){replaceRange(ta,a,b,'  ');return}
  const lines=v.slice(s,e).split('\n');let removedFirst=0;
  const nl=lines.map((l,i)=>{if(!out)return '  '+l;const m=/^( {1,2}|\t)/.exec(l);if(i===0)removedFirst=m?m[0].length:0;return m?l.slice(m[0].length):l});
  const text=nl.join('\n');
  if(text===v.slice(s,e))return;
  replaceRange(ta,s,e,text);
  if(a===b)ta.setSelectionRange(Math.max(s,a+(out?-removedFirst:2)),Math.max(s,a+(out?-removedFirst:2)));
  else ta.setSelectionRange(s,s+text.length);
}
const CMT={js:['// ',''],clike:['// ',''],py:['# ',''],sh:['# ',''],sql:['-- ',''],css:['/* ',' */'],html:[CO+' ',' '+CC]};
function toggleComment(ta,lang){
  const cm=CMT[lang];if(!cm)return;
  const {v,a,b,s,e}=blockRange(ta);const [o,c]=cm,ot=o.trim(),ct=c.trim();
  const lines=v.slice(s,e).split('\n'),non=lines.filter(l=>l.trim());
  const all=non.length&&non.every(l=>{const x=l.trim();return x.startsWith(ot)&&(!ct||x.endsWith(ct))});
  const out=lines.map(l=>{
    if(!l.trim())return l;const ind=l.match(/^\s*/)[0];let body=l.slice(ind.length);
    if(all){body=body.slice(ot.length);if(body[0]===' ')body=body.slice(1);if(ct){body=body.slice(0,body.length-ct.length);if(body.endsWith(' '))body=body.slice(0,-1)}return ind+body}
    return ind+o+body+c;
  }).join('\n');
  replaceRange(ta,s,e,out,s,s+out.length);
}
function duplicateLine(ta){
  const v=ta.value,a=ta.selectionStart,b=ta.selectionEnd;
  if(a!==b){replaceRange(ta,b,b,v.slice(a,b),b,b+(b-a));return}
  const s=lineStart(v,a);let e=v.indexOf('\n',a);if(e<0)e=v.length;
  replaceRange(ta,e,e,'\n'+v.slice(s,e),a+(e-s)+1);
}
const PAIRS={'(':')','[':']','{':'}','"':'"',"'":"'",'`':'`'};
const isWord=c=>!!c&&/[\w$]/.test(c);

function makePane(tab){
  const el=document.createElement('div');el.className='pane';el.hidden=true;
  el.innerHTML='<div class="scroller"><div class="inner"><div class="gut"></div><div class="code"><pre class="marks" aria-hidden="true"></pre><pre class="hl" aria-hidden="true"></pre><textarea class="ta" spellcheck="false" autocapitalize="off" autocomplete="off" autocorrect="off" wrap="off" aria-label="editor"></textarea></div></div></div>';
  const sc=$('.scroller',el),gut=$('.gut',el),hl=$('.hl',el),marks=$('.marks',el),ta=$('.ta',el),code=$('.code',el);
  const lang=langOf(tab.path);let lines=0,raf=0,mk0=null;
  ta.value=tab.text;
  const P={el,ta,sc,lang,
    refresh(){
      const v=ta.value,big=v.length>CONFIG.HL_LIMIT;
      code.classList.toggle('plain',big);
      hl.innerHTML=(big?esc(v):highlight(v,lang))+TAIL;
      let n=1;for(let i=v.indexOf('\n');i!==-1;i=v.indexOf('\n',i+1))n++;
      if(n!==lines){lines=n;let s='';for(let i=1;i<=n;i++)s+=i+'\n';gut.textContent=s.slice(0,-1)}
      if(mk0)P.setMarks(mk0.ms,mk0.len,mk0.cur);
    },
    setMarks(ms,len,cur){
      if(!ms||!ms.length){mk0=null;marks.innerHTML='';return}
      mk0={ms,len,cur};const v=ta.value;let out='',last=0;
      ms.forEach((i,k)=>{if(i<last)return;out+=esc(v.slice(last,i))+'<mark'+(k===cur?' class="cur"':'')+'>'+esc(v.slice(i,i+len))+'</mark>';last=i+len});
      marks.innerHTML=out+esc(v.slice(last))+TAIL;
    },
    reveal(center){
      const pos=ta.selectionEnd,v=ta.value,ls=lineStart(v,pos);
      const line=v.slice(0,ls).split('\n').length-1;let vc=0;
      for(let i=ls;i<pos;i++){vc+=v[i]==='\t'?2-(vc%2):1}
      const LH=Ed.lh,CW=Ed.cw(),gw=gut.offsetWidth;
      const top=12+line*LH,left=gw+12+vc*CW;
      if(center)sc.scrollTop=Math.max(0,top-sc.clientHeight/2);
      else if(top<sc.scrollTop+4)sc.scrollTop=Math.max(0,top-LH);
      else if(top+LH>sc.scrollTop+sc.clientHeight-4)sc.scrollTop=top+LH*2-sc.clientHeight;
      if(left<sc.scrollLeft+gw+10)sc.scrollLeft=Math.max(0,left-gw-30);
      else if(left>sc.scrollLeft+sc.clientWidth-30)sc.scrollLeft=left-sc.clientWidth+60;
    },
    goto(n){
      const v=ta.value;let idx=0;for(let i=1;i<n;i++){const j=v.indexOf('\n',idx);if(j<0)break;idx=j+1}
      let e=v.indexOf('\n',idx);if(e<0)e=v.length;
      ta.setSelectionRange(idx,e);P.reveal(true);
    },
    setValue(v){replaceRange(ta,0,ta.value.length,v,0)}
  };
  ta.addEventListener('input',()=>{
    tab.text=ta.value;cancelAnimationFrame(raf);raf=requestAnimationFrame(()=>{P.refresh();P.reveal()});
    Ed.onChange(tab);
  });
  ['keyup','click','focus'].forEach(ev=>ta.addEventListener(ev,()=>Ed.renderStatus()));
  sc.addEventListener('mousedown',e=>{if(e.target===sc||e.target.classList.contains('inner')||e.target===gut){setTimeout(()=>ta.focus(),0)}});
  ta.addEventListener('keydown',e=>{
    if(e.isComposing)return;
    const mod=e.ctrlKey||e.metaKey,k=e.key;
    if(mod){
      if(e.code==='KeyS'){e.preventDefault();Ed.save(tab,true);return}
      if(e.code==='KeyF'||e.code==='KeyH'){e.preventDefault();Ed.openFind();return}
      if(e.code==='KeyG'){e.preventDefault();Ed.gotoDialog();return}
      if(e.code==='Slash'){e.preventDefault();toggleComment(ta,lang);return}
      if(e.code==='KeyD'){e.preventDefault();duplicateLine(ta);return}
      if(e.code==='Enter'){e.preventDefault();Ed.togglePreview(true);return}
      return;
    }
    if(k==='Tab'){e.preventDefault();doIndent(ta,e.shiftKey);return}
    const v=ta.value,a=ta.selectionStart,b=ta.selectionEnd;
    if(k==='Enter'&&!e.shiftKey){
      e.preventDefault();
      const ls=lineStart(v,a),line=v.slice(ls,a),ind=/^[ \t]*/.exec(line)[0],prev=v[a-1],next=v[b];
      let text,caret;
      if(prev&&'{[('.includes(prev)){
        if(next&&PAIRS[prev]===next){text='\n'+ind+'  \n'+ind;caret=a+1+ind.length+2}
        else{text='\n'+ind+'  ';caret=a+text.length}
      }else if(lang==='py'&&/:\s*$/.test(line)){text='\n'+ind+'  ';caret=a+text.length}
      else{text='\n'+ind;caret=a+text.length}
      replaceRange(ta,a,b,text,caret);return;
    }
    if(k==='Backspace'&&a===b&&a>0&&PAIRS[v[a-1]]&&PAIRS[v[a-1]]===v[a]){e.preventDefault();replaceRange(ta,a-1,a+1,'',a-1);return}
    if(PAIRS[k]&&!e.altKey){
      const cl=PAIRS[k],quote=k===cl;
      if(a!==b){e.preventDefault();replaceRange(ta,a,b,k+v.slice(a,b)+cl,a+1,b+1);return}
      if(quote&&v[a]===k){e.preventDefault();ta.setSelectionRange(a+1,a+1);return}
      if(quote&&isWord(v[a-1]))return;
      if(!v[a]||/[\s)\]}.,;:]/.test(v[a])){e.preventDefault();replaceRange(ta,a,a,k+cl,a+1)}
      return;
    }
    if(')]}'.includes(k)&&a===b&&v[a]===k){e.preventDefault();ta.setSelectionRange(a+1,a+1)}
  });
  P.refresh();
  return P;
}
function makeStaticPane(tab,f){
  const el=document.createElement('div');el.className='pane';el.hidden=true;
  const ext=extOf(tab.path);
  if(IMG_EXT.has(ext)){
    tab.url=URL.createObjectURL(new Blob([f.buffer],{type:mimeOf(tab.path)}));
    el.innerHTML=`<div class="static"><div><img src="${tab.url}" alt=""><div class="sub" style="margin-top:10px">${esc(baseName(tab.path))} · ${fmtBytes(f.meta.size)}</div></div></div>`;
  }else{
    el.innerHTML=`<div class="static"><div><div class="empty"><div class="big">${ic('file')}</div><h3 dir="ltr">${esc(baseName(tab.path))}</h3><div style="margin-bottom:14px">${fmtBytes(f.meta.size)} · ${t('ملف ثنائي لا يمكن تحريره','Binary file, cannot be edited')}</div><button class="btn" data-act="edDownload">${ic('download')}${t('تنزيل','Download')}</button></div></div></div>`;
  }
  return {el,ta:null};
}

  /* القائمة الجانبية */
  renderSide(){

  }
  for(const e of [...doc.querySelectorAll('img[src],source[src],video[src],audio[src],track[src],embed[src]')]){
    const p=resolvePath(htmlPath,e.getAttribute('src'));if(p&&have.has(p)){const b=await blobUrl(p);if(b)e.setAttribute('src',b)}
  }
  for(const e of [...doc.querySelectorAll('video[poster]')]){const p=resolvePath(htmlPath,e.getAttribute('poster'));if(p&&have.has(p)){const b=await blobUrl(p);if(b)e.setAttribute('poster',b)}}
  for(const e of [...doc.querySelectorAll('[style*="url("]')])e.setAttribute('style',await rewriteCss(e.getAttribute('style'),htmlPath));
  const head=doc.head||doc.documentElement;
  const first=head.firstChild;
  const helper=doc.createElement('script');helper.textContent='('+previewHelper.toString()+')();';
  head.insertBefore(helper,first);
  if(Object.keys(modMap).length){
    const im=doc.createElement('script');im.type='importmap';im.textContent=JSON.stringify({imports:modMap});
    head.insertBefore(im,first);
  }
  return '<!DOCTYPE html>\n'+doc.documentElement.outerHTML;
}
window.addEventListener('message',e=>{
  if(!Ed.root)return;const fr=$('iframe',Ed.root);if(!fr||e.source!==fr.contentWindow)return;
  const d=e.data;if(!d||!d.ds)return;
  if(d.type==='console')Ed.addLog(d.data);
  else if(d.type==='nav'){
    const p=resolvePath(Ed.pvCur||'index.html',d.data);
    if(p&&Ed.metas.some(m=>m.path===p)){Ed.pvNav=p;Ed.pvUpdate()}else toast(t('الصفحة غير موجودة في المستودع: ','Page not found in repository: ')+d.data);
  }
});
window.addEventListener('beforeunload',e=>{if(Ed.tabs.some(x=>x.dirty)){e.preventDefault();e.returnValue=''}});

/* ---------- 4.12 الأوامر (Actions) ---------- */
const edTab=el=>el.dataset.p;
const A={
  go(el){if(el.dataset.to)location.hash=el.dataset.to},
  lang(){if(Ed.root)Ed.reset(true);LANG=LANG==='ar'?'en':'ar';try{localStorage.setItem('ds_lang',LANG)}catch(e){}applyLang();route()},
  newRepo(){newRepoDialog()},
  importMenu(el){menu(el,[
    {label:t('من مجلد','From a folder'),icon:'folder',onClick:()=>importFlow('folder')},
    {label:t('من ملف ZIP','From a ZIP file'),icon:'upload',onClick:()=>importFlow('zip')},
    {label:t('من ملفات','From files'),icon:'file',onClick:()=>importFlow('files')}])},
  async saveToggle(el,e){
    e.stopPropagation();const r=await getRepo(el.dataset.id);if(!r)return;
    r.saved=!r.saved;await R(store('repos','readwrite').put(r));
    toast(r.saved?t('تمت إضافته إلى المشاريع المحفوظة','Added to saved projects'):t('أُزيل من المحفوظة','Removed from saved'));route();
  },
  repoMenu(el){const id=el.dataset.id;menu(el,[
    {label:t('تعديل المعلومات','Edit details'),icon:'edit',onClick:()=>editRepoDialog(id)},
    {label:t('تنزيل المستودع كـ ZIP','Download as ZIP'),icon:'download',onClick:()=>downloadPath(id,'',true)},
    '-',{label:t('حذف المستودع','Delete repository'),icon:'del',danger:true,onClick:()=>deleteRepoDialog(id)}])},
  searchFilter(el){const q=$('#sq').value.trim();location.hash='#/search?'+(q?'q='+encodeURIComponent(q)+'&':'')+'f='+el.dataset.f},
  newFile(){newFileDialog(RepoCtx.id,RepoCtx.dir)},
  newFolder(){newFolderDialog(RepoCtx.id,RepoCtx.dir)},
  uploadMenu(el){uploadMenu(el,RepoCtx.id,RepoCtx.dir)},
  rowMenu(el,e){e.stopPropagation();pathMenu(el,RepoCtx.id,el.dataset.p,el.dataset.d==='1')},
  openEditor(){location.hash=repoHash(RepoCtx.id,'edit')},
  /* المحرر */
  edBack(){Ed.saveAll();const c=Ed.cur();location.hash=c&&dirName(c.path)?repoHash(Ed.repoId,'tree',dirName(c.path)):repoHash(Ed.repoId)},
  edSide(){Ed.root.classList.toggle('side-open')},
  edNewFile(){newFileDialog(Ed.repoId,Ed.cur()?dirName(Ed.cur().path):'')},
  edNewFolder(){newFolderDialog(Ed.repoId,'')},
  edUpload(el){uploadMenu(el,Ed.repoId,'')},
  edFind(){Ed.openFind()},
  edHistory(){Ed.history()},
  edSave(){Ed.save(Ed.cur(),true)},
  edPreview(){Ed.togglePreview()},
  edDownload(){const c=Ed.cur();if(c)downloadPath(Ed.repoId,c.path,false)},
  edMore(el){
    const c=Ed.cur();const items=[];
    if(c){items.push({label:t('تنزيل الملف','Download file'),icon:'download',onClick:()=>downloadPath(Ed.repoId,c.path,false)},
      {label:t('إعادة تسمية / نقل','Rename / move'),icon:'edit',onClick:()=>fsRename(Ed.repoId,c.path,false)},
      {label:t('الانتقال إلى سطر','Go to line'),icon:'code',onClick:()=>Ed.gotoDialog()},
      {label:t('نسخ المسار','Copy path'),icon:'copy',onClick:()=>{navigator.clipboard&&navigator.clipboard.writeText(c.path);toast(t('تم النسخ','Copied'))}},'-')}
    items.push({label:t('تكبير الخط','Larger font'),icon:'add',onClick:()=>Ed.setFont(1)},
      {label:t('تصغير الخط','Smaller font'),icon:'close',onClick:()=>Ed.setFont(-1)},
      {label:Ed.autosave?t('إيقاف الحفظ التلقائي','Turn autosave off'):t('تشغيل الحفظ التلقائي','Turn autosave on'),icon:'save',onClick:()=>{Ed.autosave=!Ed.autosave;try{localStorage.setItem('ds_auto',Ed.autosave?'1':'0')}catch(e){}toast(Ed.autosave?t('الحفظ التلقائي مفعّل','Autosave on'):t('الحفظ التلقائي متوقف (استخدم Ctrl+S)','Autosave off (use Ctrl+S)'))}});
    if(c)items.push('-',{label:t('حذف الملف','Delete file'),icon:'del',danger:true,onClick:()=>fsDelete(Ed.repoId,c.path,false)});
    menu(el,items);
  },
  tabOpen(el){Ed.open(edTab(el))},
  tabClose(el,e){e.stopPropagation();Ed.closeTab(edTab(el))},
  treeToggle(el){const p=edTab(el);Ed.exp.has(p)?Ed.exp.delete(p):Ed.exp.add(p);Ed.renderSide()},
  treeMenu(el,e){e.stopPropagation();pathMenu(el,Ed.repoId,el.dataset.p,el.dataset.d==='1')},
  pvReload(){Ed.pvUpdate()},
  pvConsole(){const c=$('.cons',Ed.root);c.hidden=!c.hidden},
  pvFull(){Ed.root.classList.toggle('pv-full')},
  findNext(){Ed.findStep(1)},findPrev(){Ed.findStep(-1)},
  findClose(){Ed.closeFind()},
  findCase(){Ed.find.cs=!Ed.find.cs;Ed.findUpdate()},
  findRepl(){Ed.replOne()},findReplAll(){Ed.replAll()},
  doSearch(f){const q=$('input',f).value.trim();location.hash='#/search'+(q?'?q='+encodeURIComponent(q):'');if(location.hash.startsWith('#/search'))route()}
};
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const fn=A[el.dataset.act];if(fn){e.preventDefault();fn(el,e)}
});
document.addEventListener('submit',e=>{
  const f=e.target.closest('[data-submit]');if(!f)return;e.preventDefault();
  const fn=A[f.dataset.submit];if(fn)fn(f,e);
});
document.addEventListener('input',e=>{if(e.target.id==='rf')renderRepoList()});
document.addEventListener('change',e=>{if(e.target.id==='rs')renderRepoList()});
document.addEventListener('keydown',e=>{
  if(e.key==='/'&&!/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)&&!e.ctrlKey&&!e.metaKey){const i=$('#sq')||$('#hq')||$('#tsq');if(i){e.preventDefault();i.focus()}}
  if((e.ctrlKey||e.metaKey)&&e.code==='KeyS'&&Ed.root&&VIEW.contains(Ed.root)){e.preventDefault();Ed.save(Ed.cur(),true)}
});
VIEW.addEventListener('scroll',()=>$('#topbar').classList.toggle('sc',VIEW.scrollTop>4));
/* سحب وإفلات الملفات */
let dragDepth=0,dz=null;
const hasFiles=e=>[...((e.dataTransfer&&e.dataTransfer.types)||[])].includes('Files');
const showDrop=on=>{if(on&&!dz){dz=document.createElement('div');dz.className='dropzone';dz.textContent=t('أفلت الملفات أو المجلدات هنا لرفعها','Drop files or folders here to upload');document.body.appendChild(dz)}else if(!on&&dz){dz.remove();dz=null}};
addEventListener('dragenter',e=>{if(RepoCtx.active&&hasFiles(e)){dragDepth++;showDrop(true)}});
addEventListener('dragleave',()=>{if(RepoCtx.active){dragDepth=Math.max(0,dragDepth-1);if(!dragDepth)showDrop(false)}});
addEventListener('dragover',e=>{if(RepoCtx.active&&hasFiles(e))e.preventDefault()});
addEventListener('drop',async e=>{
  if(!RepoCtx.active||!hasFiles(e))return;e.preventDefault();dragDepth=0;showDrop(false);
  const items=await collectDrop(e.dataTransfer);if(items.length)uploadInto(RepoCtx.id,RepoCtx.dir,items);
});

/* ---------- 4.13 الموجّه (Router) ---------- */
let RT=0;
async function viewEditor(id,path,line,my){
  const repo=await getRepo(id);
  if(my!==RT)return;
  if(!repo){setView(`<div class="empty"><h3>${t('المستودع غير موجود','Repository not found')}</h3><a href="#/repos">${t('المستودعات','Repositories')}</a></div>`);return}
  await Ed.mount(id);if(my!==RT)return;
  RepoCtx.id=id;RepoCtx.dir='';RepoCtx.active=true;RepoCtx.repo=repo;
  APP.classList.add('editor-mode');VIEW.className='edit';
  if(VIEW.firstChild!==Ed.root){VIEW.replaceChildren(Ed.root)}
  if(path){await Ed.open(path,{line});if(path&&line)Ed.cur()&&Ed.cur().pane.goto&&Ed.cur().pane.goto(line)}
  else if(Ed.active&&Ed.tab(Ed.active)){Ed.activate(Ed.active)}
  else Ed.showEmpty();
}
async function route(){
  closeMenu();
  const my=++RT;
  const raw=(location.hash||'#/home').slice(1),qi=raw.indexOf('?');
  const pth=qi<0?raw:raw.slice(0,qi),qs=new URLSearchParams(qi<0?'':raw.slice(qi+1));
  const seg=pth.split('/').filter(Boolean).map(dec),k=seg[0]||'home';
  if(!(k==='r'&&seg[1]))RepoCtx.active=false;
  try{
    if(k==='r'&&seg[1]){
      setNav('repos');const id=seg[1],mode=seg[2]||'tree';
      if(mode==='edit'||mode==='blob')await viewEditor(id,mode==='blob'?seg.slice(3).join('/'):'',+qs.get('l')||0,my);
      else{
        const r=await viewRepoPage(id,mode==='activity'?'activity':'code',mode==='tree'?seg.slice(3).join('/'):'',my);
        if(my!==RT)return;setView(r.html);if(r.after)r.after();
      }
    }else if(k==='repos'){setNav('repos');const h=await viewRepos();if(my!==RT)return;setView(h);renderRepoList()}
    else if(k==='search'){
      setNav('search');const q=qs.get('q')||'',f=qs.get('f')||'all';setView(viewSearchShell(q,f));
      $('#tsq').value=q;runSearch(q,f);if(!q)$('#sq').focus();
    }
    else if(k==='saved'){setNav('saved');const h=await viewSaved();if(my!==RT)return;setView(h)}
    else{setNav('home');const h=await viewHome();if(my!==RT)return;setView(h)}
  }catch(err){
    console.error(err);if(my!==RT)return;
    setView(`<div class="empty"><div class="big">${ic('close')}</div><h3>${t('حدث خطأ','Something went wrong')}</h3><div dir="ltr">${esc(String(err&&err.message||err))}</div></div>`);
  }
  $('#topbar').classList.toggle('sc',false);
}

/* ---------- 4.14 التشغيل ---------- */
(async function boot(){
  applyLang();
  try{db=await openDB()}catch(e){
    VIEW.innerHTML=`<div class="empty"><div class="big">${ic('close')}</div><h3>${t('التخزين المحلي غير متاح','Local storage unavailable')}</h3><div>${t('هذا التطبيق يحتاج IndexedDB. جرّب نافذة عادية (غير خاصة) أو متصفحاً آخر.','This app needs IndexedDB. Try a normal (non-private) window or another browser.')}</div></div>`;return;
  }
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  addEventListener('hashchange',route);
  route();
})();
})();
